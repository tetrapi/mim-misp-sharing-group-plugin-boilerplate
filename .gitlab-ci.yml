image: docker:latest

stages:
  - test
  - integration
  - security
  - sbom

variables:
  DS_MAX_DEPTH: "-1"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "web"'

# ==============================================================================
# INCLUDES: Official GitLab Security Templates
# ==============================================================================
include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml

.sast-analyzer:
  stage: security
  needs: []

.secret-analyzer:
  stage: security
  needs: []

.dependency-scanning-analyzer:
  stage: security
  needs: []

secret_detection:
  stage: security
  needs: []

sast:
  stage: security
  needs: []

dependency_scanning:
  stage: security
  needs: []

# ==============================================================================
# STAGE 1: test - Code Quality, Linters & Formatting
# ==============================================================================

shellcheck:
  stage: test
  image: koalaman/shellcheck-alpine:latest
  needs: []
  script:
    - shellcheck dev.sh msgd_installer.sh

linting-psr12:
  stage: test
  image: registry.gitlab.com/pipeline-components/php-codesniffer:latest
  needs: []
  script:
    - phpcs -s -p --colors --extensions=php --standard=.phpcs.xml MsgdPlug/

eslint-js:
  stage: test
  image: node:latest
  needs: []
  variables:
    ESLINT_USE_FLAT_CONFIG: "false"
  script:
    - npx eslint@8 MsgdPlug/webroot/js/

yamllint:
  stage: test
  image: registry.gitlab.com/pipeline-components/yamllint:latest
  needs: []
  script:
    - 'yamllint -d "{extends: relaxed, rules: {line-length: disable}}" .'

prettier:
  stage: test
  image: node:latest
  needs: []
  script:
    - npx prettier --check MsgdPlug/webroot/js/

# ==============================================================================
# STAGE 2: integration - MISP Stack + Plugin Integration Test
# ==============================================================================

test-misp-login-200:
  stage: integration
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  needs: []
  before_script:
    - apk add --no-progress --no-cache bash dos2unix curl
    - if [ ! -f .env ]; then cp example.env .env || touch .env; fi
    - echo "BASE_URL=https://127.0.0.1" >> .env
    - dos2unix dev.sh msgd_installer.sh 2>/dev/null || true
    - chmod +x dev.sh msgd_installer.sh
  script:
    - echo "--> Executando Deploy e Instalador via dev.sh..."
    - printf "1\n" | ./dev.sh
    - echo "--> Validando status HTTP do MISP apos instalacao..."
    - |
      HTTP_STATUS=$(docker compose -f docker-compose-dev.yml exec -T misp-core curl -k -s -o /dev/null -w "%{http_code}" https://127.0.0.1/users/login || echo "000")
      echo "Status retornado: HTTP $HTTP_STATUS"
      if [ "$HTTP_STATUS" != "200" ] && [ "$HTTP_STATUS" != "302" ]; then
        echo "ERRO: MISP respondeu com HTTP $HTTP_STATUS"
        exit 1
      fi
  after_script:
    - docker compose --env-file .env -f docker-compose-dev.yml down -v || true

# ==============================================================================
# STAGE 3: security - SAST, Secrets & Infrastructure Scanning
# ==============================================================================

php-security-checker:
  stage: security
  image: registry.gitlab.com/pipeline-components/php-security-checker:latest
  needs: []
  script:
    - if [ -f composer.lock ]; then security-checker security:check composer.lock; else echo "composer.lock not found, skipping."; fi

iac-config-scan:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  needs: []
  script:
    - trivy config --exit-code 0 --severity HIGH,CRITICAL,MEDIUM --format json -o trivy-iac-report.json .
    - trivy config --exit-code 0 --severity HIGH,CRITICAL,MEDIUM .
  artifacts:
    when: always
    paths:
      - trivy-iac-report.json

# ==============================================================================
# STAGE 4: sbom - EU CRA Software Inventory Generation
# ==============================================================================

generate-sbom:
  stage: sbom
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  needs: []
  before_script:
    - wget -qO- https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
  script:
    - syft dir:. -o cyclonedx-json=gl-sbom-plugin.cdx.json
    - syft dir:. -o spdx-json=sbom-plugin.spdx.json
    - trivy fs --scanners vuln,license --format cyclonedx -o gl-sbom-vulnerabilities.cdx.json .
    - trivy fs --scanners vuln --exit-code 1 --severity CRITICAL .
  artifacts:
    expire_in: 30 days
    paths:
      - gl-sbom-plugin.cdx.json
      - sbom-plugin.spdx.json
      - gl-sbom-vulnerabilities.cdx.json
    reports:
      cyclonedx: ["gl-sbom-plugin.cdx.json", "gl-sbom-vulnerabilities.cdx.json"]
