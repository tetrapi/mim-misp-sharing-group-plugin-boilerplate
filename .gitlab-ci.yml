image: docker:latest

stages:
  - test
  - integration
  - security
  - sbom

variables:
  DS_MAX_DEPTH: "-1"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "web"'

# ==============================================================================
# INCLUDES: Official GitLab Security Templates
# ==============================================================================
include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml

.sast-analyzer:
  stage: security
  needs: []

.secret-analyzer:
  stage: security
  needs: []

.dependency-scanning-analyzer:
  stage: security
  needs: []

secret_detection:
  stage: security
  needs: []

sast:
  stage: security
  needs: []

dependency_scanning:
  stage: security
  needs: []

# ==============================================================================
# STAGE 1: test - Code Quality, Linters & Formatting
# ==============================================================================

shellcheck:
  stage: test
  image: koalaman/shellcheck-alpine:latest
  needs: []
  script:
    - shellcheck dev.sh msgd_installer.sh

linting-psr12:
  stage: test
  image: registry.gitlab.com/pipeline-components/php-codesniffer:latest
  needs: []
  script:
    - phpcs -s -p --colors --extensions=php --standard=.phpcs.xml MsgdPlug/

eslint-js:
  stage: test
  image: node:latest
  needs: []
  variables:
    ESLINT_USE_FLAT_CONFIG: "false"
  script:
    - npx eslint@8 MsgdPlug/webroot/js/

yamllint:
  stage: test
  image: registry.gitlab.com/pipeline-components/yamllint:latest
  needs: []
  script:
    - 'yamllint -d "{extends: relaxed, rules: {line-length: disable}}" .'

prettier:
  stage: test
  image: node:latest
  needs: []
  script:
    - npx prettier --check MsgdPlug/webroot/js/

# ==============================================================================
# STAGE 2: integration - MISP Stack + Plugin Integration Test
# ==============================================================================

test-misp-login-200:
  stage: integration
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  needs: []
  before_script:
    - apk add --no-progress --no-cache curl bash dos2unix
    - if [ -f example.env ]; then cp example.env .env; else touch .env; fi
    - |
      cat << 'EOF' >> .env
      MODULES_COMMIT=main
      BASE_URL=https://localhost
      DISABLE_SSL_REDIRECT=false
      DISABLE_CA_REFRESH=false
      CRON_PULLALL=false
      CRON_PUSHALL=false
      DISABLE_IPV6=false
      EOF
    - dos2unix msgd_installer.sh 2>/dev/null || true
    - chmod +x msgd_installer.sh
  script:
    - docker compose --env-file .env -f docker-compose-dev.yml up -d redis db mail misp-modules
    - docker compose --env-file .env -f docker-compose-dev.yml up -d misp-core

    - |
      echo "--> Aguardando inicializacao do MISP Core (ate 5 minutos)..."
      BASE_READY=0
      for i in $(seq 1 60); do
        HTTP_STATUS=$(curl -k -s -o /dev/null -w "%{http_code}" https://localhost/users/login || echo "000")
        echo "Tentativa $i/60 (MISP Base): HTTP $HTTP_STATUS"

        if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 302 ]; then
          echo "SUCCESS: MISP Base esta ativo e a responder com HTTP $HTTP_STATUS!"
          BASE_READY=1
          break
        fi
        sleep 5
      done

      if [ "$BASE_READY" -ne 1 ]; then
        echo "ERROR: Timeout ao aguardar pela inicializacao do MISP Base."
        exit 1
      fi

    - echo "--> Executando o instalador do plugin..."
    - docker compose --env-file .env -f docker-compose-dev.yml exec -T misp-core bash /var/www/MISP/msgd_installer.sh --auto

    - |
      echo "--> Validando acesso ao MISP apos instalacao do plugin..."
      PLUGIN_READY=0
      for i in $(seq 1 12); do
        HTTP_STATUS=$(curl -k -s -o /dev/null -w "%{http_code}" https://localhost/users/login || echo "000")
        echo "Tentativa $i/12 (MISP + Plugin): HTTP $HTTP_STATUS"

        if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 302 ]; then
          echo "SUCCESS: MISP com plugin ativo respondeu com HTTP $HTTP_STATUS!"
          PLUGIN_READY=1
          break
        fi
        sleep 5
      done

      if [ "$PLUGIN_READY" -ne 1 ]; then
        echo "ERROR: MISP deixou de responder apos a instalacao do plugin."
        exit 1
      fi

  after_script:
    - docker compose -f docker-compose-dev.yml logs misp-modules || true
    - docker compose -f docker-compose-dev.yml logs misp-core || true
    - docker compose -f docker-compose-dev.yml down -v || true

# ==============================================================================
# STAGE 3: security - SAST, Secrets & Infrastructure Scanning
# ==============================================================================

php-security-checker:
  stage: security
  image: registry.gitlab.com/pipeline-components/php-security-checker:latest
  needs: []
  script:
    - if [ -f composer.lock ]; then security-checker security:check composer.lock; else echo "composer.lock not found, skipping."; fi

iac-config-scan:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  needs: []
  script:
    - trivy config --exit-code 0 --severity HIGH,CRITICAL,MEDIUM --format json -o trivy-iac-report.json .
    - trivy config --exit-code 0 --severity HIGH,CRITICAL,MEDIUM .
  artifacts:
    when: always
    paths:
      - trivy-iac-report.json

# ==============================================================================
# STAGE 4: sbom - EU CRA Software Inventory Generation
# ==============================================================================

generate-sbom:
  stage: sbom
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  needs: []
  before_script:
    - wget -qO- https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
  script:
    - syft dir:. -o cyclonedx-json=gl-sbom-plugin.cdx.json
    - syft dir:. -o spdx-json=sbom-plugin.spdx.json
    - trivy fs --scanners vuln,license --format cyclonedx -o gl-sbom-vulnerabilities.cdx.json .
    - trivy fs --scanners vuln --exit-code 1 --severity CRITICAL .
  artifacts:
    expire_in: 30 days
    paths:
      - gl-sbom-plugin.cdx.json
      - sbom-plugin.spdx.json
      - gl-sbom-vulnerabilities.cdx.json
    reports:
      cyclonedx: ["gl-sbom-plugin.cdx.json", "gl-sbom-vulnerabilities.cdx.json"]
