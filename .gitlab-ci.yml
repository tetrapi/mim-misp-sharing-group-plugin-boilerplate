image: docker:latest

stages:
  - test
  - integration
  - security
  - sbom

variables:
  DS_MAX_DEPTH: "-1"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "web"'

# ==============================================================================
# INCLUDES: Official GitLab Security Templates
# ==============================================================================
include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml

.sast-analyzer:
  stage: security
  needs: []

.secret-analyzer:
  stage: security
  needs: []

.dependency-scanning-analyzer:
  stage: security
  needs: []

secret_detection:
  stage: security
  needs: []

sast:
  stage: security
  needs: []

dependency_scanning:
  stage: security
  needs: []

# ==============================================================================
# STAGE 1: test - Code Quality, Linters & Formatting
# ==============================================================================

shellcheck:
  stage: test
  image: koalaman/shellcheck-alpine:latest
  needs: []
  script:
    - shellcheck dev.sh msgd_installer.sh

linting-psr12:
  stage: test
  image: registry.gitlab.com/pipeline-components/php-codesniffer:latest
  needs: []
  script:
    - phpcs -s -p --colors --extensions=php --standard=.phpcs.xml MsgdPlug/

eslint-js:
  stage: test
  image: node:latest
  needs: []
  variables:
    ESLINT_USE_FLAT_CONFIG: "false"
  script:
    - npx eslint@8 MsgdPlug/webroot/js/

yamllint:
  stage: test
  image: registry.gitlab.com/pipeline-components/yamllint:latest
  needs: []
  script:
    - 'yamllint -d "{extends: relaxed, rules: {line-length: disable}}" .'

prettier:
  stage: test
  image: node:latest
  needs: []
  script:
    - npx prettier --check MsgdPlug/webroot/js/

# ==============================================================================
# STAGE 2: integration - MISP Stack + Plugin Integration Test
# ==============================================================================

test-misp-installer:
  stage: integration
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  needs: []
  before_script:
    - apk add --no-progress --no-cache bash dos2unix
    - |
      if [ ! -f .env ] && [ -f example.env ]; then
        cp example.env .env
      elif [ ! -f .env ]; then
        touch .env
      fi
    - |
      cat << 'EOF' >> .env
      CORE_TAG=latest
      PHP_VER=8.2
      MODULES_TAG=latest
      MODULES_COMMIT=main
      BASE_URL=https://127.0.0.1
      DISABLE_SSL_REDIRECT=false
      DISABLE_CA_REFRESH=false
      DISABLE_IPV6=false
      DEBUG=0
      EOF
    - dos2unix msgd_installer.sh .env 2>/dev/null || true
    - chmod +x msgd_installer.sh
  script:
    - echo "--> Starting containers..."
    - docker compose --env-file .env -f docker-compose-dev.yml up -d

    - echo "--> Streaming live logs for misp-core..."
    - docker compose --env-file .env -f docker-compose-dev.yml logs -f misp-core &
    - LOGS_PID=$!

    - |
      # Wait loop that allows transient 'unhealthy' states during component updates
      BASE_READY=0
      for i in $(seq 1 240); do
        MISP_CONTAINER=$(docker compose --env-file .env -f docker-compose-dev.yml ps -q misp-core 2>/dev/null)
      
        if [ -n "$MISP_CONTAINER" ]; then
          STATUS=$(docker inspect --format "{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}" "$MISP_CONTAINER" 2>/dev/null || echo "unknown")

          if [ "$STATUS" = "healthy" ]; then
            echo "--> Container misp-core is healthy!"
            BASE_READY=1
            break
          elif [ "$STATUS" = "missing" ]; then
            echo "--> [WARNING] No health check defined in compose. Applying 15s buffer..."
            sleep 15
            BASE_READY=1
            break
          fi
          # 'starting' and 'unhealthy' will continue polling until timeout
        fi
        sleep 5
      done

      if [ "$BASE_READY" -ne 1 ]; then
        echo "ERROR: Timeout reached waiting for misp-core to stabilize."
        kill $LOGS_PID 2>/dev/null || true
        exit 1
      fi

    - echo "--> Executing installer..."
    - docker compose --env-file .env -f docker-compose-dev.yml exec -T misp-core bash /var/www/MISP/msgd_installer.sh --auto

    - echo "--> Plugin installation completed successfully!"
    - kill $LOGS_PID 2>/dev/null || true

  after_script:
    - docker compose --env-file .env -f docker-compose-dev.yml down -v || true
    - 
# ==============================================================================
# STAGE 3: security - SAST, Secrets & Infrastructure Scanning
# ==============================================================================

php-security-checker:
  stage: security
  image: registry.gitlab.com/pipeline-components/php-security-checker:latest
  needs: []
  script:
    - if [ -f composer.lock ]; then security-checker security:check composer.lock; else echo "composer.lock not found, skipping."; fi

iac-config-scan:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  needs: []
  script:
    - trivy config --exit-code 0 --severity HIGH,CRITICAL,MEDIUM --format json -o trivy-iac-report.json .
    - trivy config --exit-code 0 --severity HIGH,CRITICAL,MEDIUM .
  artifacts:
    when: always
    paths:
      - trivy-iac-report.json

# ==============================================================================
# STAGE 4: sbom - EU CRA Software Inventory Generation
# ==============================================================================

generate-sbom:
  stage: sbom
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  needs: []
  before_script:
    - wget -qO- https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
  script:
    - syft dir:. -o cyclonedx-json=gl-sbom-plugin.cdx.json
    - syft dir:. -o spdx-json=sbom-plugin.spdx.json
    - trivy fs --scanners vuln,license --format cyclonedx -o gl-sbom-vulnerabilities.cdx.json .
    - trivy fs --scanners vuln --exit-code 1 --severity CRITICAL .
  artifacts:
    expire_in: 30 days
    paths:
      - gl-sbom-plugin.cdx.json
      - sbom-plugin.spdx.json
      - gl-sbom-vulnerabilities.cdx.json
    reports:
      cyclonedx: ["gl-sbom-plugin.cdx.json", "gl-sbom-vulnerabilities.cdx.json"]
