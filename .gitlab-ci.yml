image: docker:latest

stages:
  - test
  - integration
  - security
  - sbom

variables:
  DS_MAX_DEPTH: "-1"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "web"'

# ==============================================================================
# INCLUDES: Templates Oficiais de Segurança do GitLab
# ==============================================================================
include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml

# Sobrescrita para vincular os scanners do GitLab ao estágio 'security'
.sast-analyzer:
  stage: security
  needs: []

.secret-analyzer:
  stage: security
  needs: []

.dependency-scanning-analyzer:
  stage: security
  needs: []

secret_detection:
  stage: security
  needs: []

sast:
  stage: security
  needs: []

dependency_scanning:
  stage: security
  needs: []

# ==============================================================================
# STAGE 1: test - Qualidade de Código, Linters e Formatação
# ==============================================================================

shellcheck:
  stage: test
  image: koalaman/shellcheck-alpine:latest
  needs: []
  script:
    - shellcheck dev.sh msgd_installer.sh || true

linting-psr12:
  stage: test
  image: registry.gitlab.com/pipeline-components/php-codesniffer:latest
  needs: []
  script:
    - phpcs -s -p --colors --extensions=php --standard=PSR12 MsgdPlug/ || true

eslint-js:
  stage: test
  image: node:latest
  needs: []
  script:
    - npx eslint MsgdPlug/webroot/js/ || true

yamllint:
  stage: test
  image: registry.gitlab.com/pipeline-components/yamllint:latest
  allow_failure: true
  needs: []
  script:
    - yamllint -d "{extends: relaxed, rules: {line-length: disable}}" .

prettier:
  stage: test
  image: node:latest
  needs: []
  script:
    - npx prettier --check MsgdPlug/webroot/js/ || true

# ==============================================================================
# STAGE 2: integration - Teste da Stack MISP + Plugin
# ==============================================================================

test-misp-login-200:
  stage: integration
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  needs: []
  before_script:
    - apk add --no-progress --no-cache curl bash
    - if [ -f example.env ]; then cp example.env .env; else touch .env; fi
  script:
    - docker compose -f docker-compose-dev.yml up -d

    - |
      echo "Aguardando o container misp-core inicializar..."
      until docker compose -f docker-compose-dev.yml exec -T misp-core true 2>/dev/null; do
      sleep 2
      done

      echo "Copiando msgd_installer.sh para dentro do container..."
      docker compose -f docker-compose-dev.yml cp ./msgd_installer.sh misp-core:/var/www/MISP/msgd_installer.sh
      docker compose -f docker-compose-dev.yml exec -T misp-core chmod +x /var/www/MISP/msgd_installer.sh
      docker compose -f docker-compose-dev.yml exec -T misp-core bash /var/www/MISP/msgd_installer.sh --auto

    - |
      echo "Testando endpoint: https://localhost/users/login..."
      for i in $(seq 1 36); do
        HTTP_STATUS=$(curl -k -s -o /dev/null -w "%{http_code}" https://localhost/users/login || echo "000")
        if [ "$HTTP_STATUS" -eq 200 ]; then
          echo "SUCESSO: /users/login respondeu HTTP 200!"
          exit 0
        fi
        echo "Tentativa $i/36: Status HTTP $HTTP_STATUS. Aguardando 5s..."
        sleep 5
      done
      echo "ERRO: Timeout aguardando o MISP retornar HTTP 200."
      exit 1
  after_script:
    - docker compose -f docker-compose-dev.yml logs misp-core || true
    - docker compose -f docker-compose-dev.yml down -v || true

# ==============================================================================
# STAGE 3: security - Análise SAST, Segredos e Infraestrutura
# ==============================================================================

php-security-checker:
  stage: security
  image: registry.gitlab.com/pipeline-components/php-security-checker:latest
  needs: []
  script:
    - if [ -f composer.lock ]; then security-checker security:check composer.lock; else echo "composer.lock não encontrado, pulando."; fi

iac-config-scan:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  needs: []
  script:
    - trivy config --exit-code 0 --severity HIGH,CRITICAL,MEDIUM --format json -o trivy-iac-report.json .
    - trivy config --exit-code 0 --severity HIGH,CRITICAL,MEDIUM .
  artifacts:
    when: always
    paths:
      - trivy-iac-report.json

# ==============================================================================
# STAGE 4: sbom - Gerador de Inventários de Software (EU CRA)
# ==============================================================================

generate-sbom:
  stage: sbom
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  needs: []
  before_script:
    - wget -qO- https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
  script:
    - syft dir:. -o cyclonedx-json=gl-sbom-plugin.cdx.json
    - syft dir:. -o spdx-json=sbom-plugin.spdx.json
    - trivy fs --scanners vuln,license --format cyclonedx -o gl-sbom-vulnerabilities.cdx.json .
    - trivy fs --scanners vuln --exit-code 1 --severity CRITICAL .
  artifacts:
    expire_in: 30 days
    paths:
      - gl-sbom-plugin.cdx.json
      - sbom-plugin.spdx.json
      - gl-sbom-vulnerabilities.cdx.json
    reports:
      cyclonedx:
        - gl-sbom-plugin.cdx.json
        - gl-sbom-vulnerabilities.cdx.json
