image: docker:latest

stages:
  - test
  - integration
  - security
  - sbom

variables:
  DS_MAX_DEPTH: "-1"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "web"'

# ==============================================================================
# INCLUDES: Official GitLab Security Templates
# ==============================================================================
include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml

.sast-analyzer:
  stage: security
  needs: []

.secret-analyzer:
  stage: security
  needs: []

.dependency-scanning-analyzer:
  stage: security
  needs: []

secret_detection:
  stage: security
  needs: []

sast:
  stage: security
  needs: []

dependency_scanning:
  stage: security
  needs: []

# ==============================================================================
# STAGE 1: test - Code Quality, Linters & Formatting
# ==============================================================================

shellcheck:
  stage: test
  image: koalaman/shellcheck-alpine:latest
  needs: []
  script:
    - shellcheck dev.sh msgd_installer.sh

linting-psr12:
  stage: test
  image: registry.gitlab.com/pipeline-components/php-codesniffer:latest
  needs: []
  script:
    - phpcs -s -p --colors --extensions=php --standard=.phpcs.xml MsgdPlug/

eslint-js:
  stage: test
  image: node:latest
  needs: []
  variables:
    ESLINT_USE_FLAT_CONFIG: "false"
  script:
    - npx eslint@8 MsgdPlug/webroot/js/

yamllint:
  stage: test
  image: registry.gitlab.com/pipeline-components/yamllint:latest
  needs: []
  script:
    - 'yamllint -d "{extends: relaxed, rules: {line-length: disable}}" .'

prettier:
  stage: test
  image: node:latest
  needs: []
  script:
    - npx prettier --check MsgdPlug/webroot/js/

# ==============================================================================
# STAGE 2: integration - MISP Stack + Plugin Integration Test
# ==============================================================================

test-misp-login-200:
  stage: integration
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  needs: []
  before_script:
    - apk add --no-progress --no-cache curl bash dos2unix
    - if [ -f example.env ]; then cp example.env .env; else touch .env; fi
    - |
      cat << 'EOF' >> .env
      MODULES_COMMIT=main
      BASE_URL=https://localhost
      DISABLE_SSL_REDIRECT=false
      DISABLE_CA_REFRESH=false
      CRON_PULLALL=false
      CRON_PUSHALL=false
      DISABLE_IPV6=false
      EOF
    - dos2unix msgd_installer.sh 2>/dev/null || true
    - chmod +x msgd_installer.sh
  script:
    - docker compose --env-file .env -f docker-compose-dev.yml up -d redis db mail misp-modules

    - |
      echo "--> Waiting for misp-modules to become healthy..."
      until [ "$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}starting{{end}}' $(docker compose -f docker-compose-dev.yml ps -q misp-modules))" = "healthy" ]; do
        echo "--> Waiting for misp-modules..."
        sleep 3
      done

    - docker compose --env-file .env -f docker-compose-dev.yml up -d misp-core

    - |
      echo "--> Waiting for misp-core container ID..."
      CONTAINER_ID=""
      until [ -n "$CONTAINER_ID" ]; do
        CONTAINER_ID=$(docker compose -f docker-compose-dev.yml ps -q misp-core 2>/dev/null || true)
        sleep 2
      done

      echo "--> Waiting for misp-core health check..."
      while true; do
        STATUS=$(docker inspect --format "{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}" "$CONTAINER_ID")
        echo "--> Current misp-core status: $STATUS"

        if [ "$STATUS" = "healthy" ]; then
          echo "--> misp-core container is healthy!"
          break
        elif [ "$STATUS" = "unhealthy" ]; then
          echo "--> [ERROR] misp-core container reported unhealthy status."
          docker compose -f docker-compose-dev.yml logs misp-core
          exit 1
        fi
        sleep 5
      done

    - |
      echo "--> STEP 1: Validating BASE MISP access (without plugin)..."
      BASE_SUCCESS=0
      for i in $(seq 1 12); do
        HTTP_STATUS=$(curl -k -s -o /dev/null -w "%{http_code}" https://localhost/users/login || echo "000")
        if [ "$HTTP_STATUS" -eq 200 ]; then
          echo "SUCCESS: Base MISP /users/login returned HTTP 200!"
          BASE_SUCCESS=1
          break
        fi
        echo "Attempt $i/12 (Base MISP): Received HTTP $HTTP_STATUS. Waiting 5s..."
        sleep 5
      done

      if [ "$BASE_SUCCESS" -ne 1 ]; then
        echo "ERROR: Base MISP failed to return HTTP 200 before plugin installation."
        exit 1
      fi

    - echo "--> Executing plugin installer..."
    - docker compose --env-file .env -f docker-compose-dev.yml exec -T misp-core bash /var/www/MISP/msgd_installer.sh --auto

    - |
      echo "--> STEP 2: Validating MISP access (with plugin installed)..."
      PLUGIN_SUCCESS=0
      for i in $(seq 1 12); do
        HTTP_STATUS=$(curl -k -s -o /dev/null -w "%{http_code}" https://localhost/users/login || echo "000")
        if [ "$HTTP_STATUS" -eq 200 ]; then
          echo "SUCCESS: MISP with plugin /users/login returned HTTP 200!"
          PLUGIN_SUCCESS=1
          break
        fi
        echo "Attempt $i/12 (Plugin MISP): Received HTTP $HTTP_STATUS. Waiting 5s..."
        sleep 5
      done

      if [ "$PLUGIN_SUCCESS" -ne 1 ]; then
        echo "ERROR: MISP failed to return HTTP 200 after plugin installation."
        exit 1
      fi

  after_script:
    - docker compose -f docker-compose-dev.yml logs misp-modules || true
    - docker compose -f docker-compose-dev.yml logs misp-core || true
    - docker compose -f docker-compose-dev.yml down -v || true

# ==============================================================================
# STAGE 3: security - SAST, Secrets & Infrastructure Scanning
# ==============================================================================

php-security-checker:
  stage: security
  image: registry.gitlab.com/pipeline-components/php-security-checker:latest
  needs: []
  script:
    - if [ -f composer.lock ]; then security-checker security:check composer.lock; else echo "composer.lock not found, skipping."; fi

iac-config-scan:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  needs: []
  script:
    - trivy config --exit-code 0 --severity HIGH,CRITICAL,MEDIUM --format json -o trivy-iac-report.json .
    - trivy config --exit-code 0 --severity HIGH,CRITICAL,MEDIUM .
  artifacts:
    when: always
    paths:
      - trivy-iac-report.json

# ==============================================================================
# STAGE 4: sbom - EU CRA Software Inventory Generation
# ==============================================================================

generate-sbom:
  stage: sbom
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  needs: []
  before_script:
    - wget -qO- https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
  script:
    - syft dir:. -o cyclonedx-json=gl-sbom-plugin.cdx.json
    - syft dir:. -o spdx-json=sbom-plugin.spdx.json
    - trivy fs --scanners vuln,license --format cyclonedx -o gl-sbom-vulnerabilities.cdx.json .
    - trivy fs --scanners vuln --exit-code 1 --severity CRITICAL .
  artifacts:
    expire_in: 30 days
    paths:
      - gl-sbom-plugin.cdx.json
      - sbom-plugin.spdx.json
      - gl-sbom-vulnerabilities.cdx.json
    reports:
      cyclonedx: ["gl-sbom-plugin.cdx.json", "gl-sbom-vulnerabilities.cdx.json"]
